<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LifeOS Ultra</title><style>
:root{color-scheme:dark;--bg:#080b15;--panel:#111727;--panel2:#171f33;--text:#eef2ff;--muted:#98a5bd;--accent:#8c7cff;--mint:#63e9c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#25204c 0,transparent 42%),var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:3px}.app{max-width:1100px;margin:auto;padding:25px 20px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:25px;font-weight:850;letter-spacing:-1px}.logo span{color:var(--mint)}.pill{background:#202944;border:1px solid #384261;padding:9px 13px;border-radius:30px;color:#cfcaff;font-size:12px}.sub{color:var(--muted);font-size:14px}h1{font-size:clamp(28px,5vw,44px);letter-spacing:-1.5px;margin:25px 0 5px}h2{font-size:18px;margin:0 0 16px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:20px 0;scrollbar-width:none}.tabs button{white-space:nowrap;background:#171d30;border:1px solid #28324a;color:#aebbd1;padding:11px 16px;border-radius:13px;transition:.25s}.tabs button.active{background:#7265e8;color:white;transform:translateY(-2px);box-shadow:0 8px 30px #7165e840}.page{animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(155deg,#192139,#111727);border:1px solid #2c3550;border-radius:20px;padding:20px;box-shadow:0 12px 30px #0002}.metric{font-size:32px;font-weight:800;margin:9px 0}.wide{grid-column:span 2}.full{grid-column:1/-1}.hint{font-size:12px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.list{display:flex;flex-direction:column;gap:10px}.item{background:#1b2439;border:1px solid #303b55;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;animation:rise .25s ease}.item.done .itemname{text-decoration:line-through;color:#8793ac}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;font-weight:650;transition:transform .18s,filter .18s}.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}.btn:active{transform:scale(.96)}.ghost{background:#29324a}.danger{background:#4a2a3b;color:#ffb6c8}.input{width:100%;background:#0d1425;color:white;border:1px solid #39445e;border-radius:12px;padding:12px;min-width:0}.formrow{display:flex;gap:8px;margin:14px 0}.formrow .input{flex:1}.ring{width:115px;height:115px;border-radius:50%;display:grid;place-items:center;margin:auto;background:conic-gradient(var(--mint) var(--p),#29344c 0);transition:background .4s}.ring:before{content:'';position:absolute;width:89px;height:89px;background:#151d31;border-radius:50%}.ring b{z-index:1;font-size:26px}.bars{display:flex;align-items:end;gap:10px;height:150px;margin-top:14px}.barwrap{flex:1;text-align:center;color:var(--muted);font-size:11px}.bar{height:120px;background:#202b44;border-radius:9px;display:flex;align-items:end;overflow:hidden;margin-bottom:7px}.bar i{width:100%;background:linear-gradient(#6feac7,#8174ef);border-radius:9px;transition:height .5s}.chat{height:340px;overflow:auto;background:#0d1425;border:1px solid #2b3650;border-radius:15px;padding:12px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:85%;padding:11px 13px;border-radius:14px;background:#25304a;font-size:14px;line-height:1.5;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:#675bd2}.bubble.bot{align-self:flex-start}.tag{font-size:12px;color:#b9ffe8}.empty{color:#8c9bb4;text-align:center;padding:20px}.footer{font-size:12px;color:#77859f;text-align:center;margin:25px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,100px);opacity:0;background:#273851;border:1px solid #4a5979;padding:12px 20px;border-radius:12px;transition:.3s;z-index:5}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:1/-1}.card{padding:15px}.metric{font-size:26px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.wide{grid-column:1/-1}.top{align-items:flex-start}.logo{font-size:22px}.pill{font-size:10px}.app{padding:18px 13px 90px}}
</style></head><body><main class="app"><header class="top"><div class="logo">◈ Life<span>OS</span> <small style="font-size:10px;vertical-align:top;color:#a59aff">ULTRA</small></div><div class="pill">✦ Your personal command center</div></header><h1 id="greeting">Your life, upgraded.</h1><div class="sub" id="today"></div><nav class="tabs" id="tabs"></nav><section id="content" class="page"></section><div class="footer">LifeOS Ultra • Free, offline-first • Your data stays in this browser</div></main><div id="toast" class="toast" role="status"></div><script>
const KEY='lifeos_ultra_v1';const defaults={name:'',habits:[{id:1,name:'Drink water',done:''},{id:2,name:'Read for 15 minutes',done:''},{id:3,name:'Move your body',done:''}],goals:[],sleep:[],workouts:[],mood:[],chat:[],activity:{}};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)};let tab='Dashboard';const tabs=['Dashboard','Habits','Workouts','Sleep','Goals','Analytics','AI Coach','Settings'];const $=s=>document.querySelector(s),date=()=>new Date().toLocaleDateString('en-CA'),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),uid=()=>Date.now()+Math.floor(Math.random()*999),notice=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)},completed=()=>state.habits.filter(h=>h.done===date()).length,percentage=()=>state.habits.length?Math.round(completed()/state.habits.length*100):0,avgSleep=()=>state.sleep.length?(state.sleep.slice(-7).reduce((a,b)=>a+Number(b.hours),0)/Math.min(7,state.sleep.length)).toFixed(1):'—',recentWorkouts=()=>state.workouts.filter(w=>w.date===date()).length,log=()=>{state.activity[date()]=completed();save()};function switchTab(t){tab=t;render()}function render(){const now=new Date();$('#today').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});$('#greeting').textContent=state.name?`Welcome back, ${state.name} ✨`:'Your life, upgraded.';$('#tabs').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="switchTab('${t}')">${t}</button>`).join('');const views={'Dashboard':dashboard,'Habits':habits,'Workouts':workouts,'Sleep':sleep,'Goals':goals,'Analytics':analytics,'AI Coach':coach,'Settings':settings};const el=$('#content');el.classList.remove('page');void el.offsetWidth;el.classList.add('page');el.innerHTML=views[tab]()}function dashboard(){return `<div class="grid"><div class="card"><div class="sub">Habits today</div><div class="metric">${completed()}/${state.habits.length}</div><div class="hint">Small steps count ✨</div></div><div class="card"><div class="sub">Recent sleep average</div><div class="metric">${avgSleep()}<small style="font-size:13px"> h</small></div><div class="hint">Last 7 entries</div></div><div class="card"><div class="sub">Workouts today</div><div class="metric">${recentWorkouts()}</div><div class="hint">Movement logged</div></div><div class="card wide"><h2>Today's habits</h2>${habitList(true)}<button class="btn ghost" style="margin-top:14px" onclick="switchTab('Habits')">Manage habits →</button></div><div class="card"><h2>Daily progress</h2><div class="ring" style="--p:${percentage()}%"><b>${percentage()}%</b></div></div><div class="card full"><div class="row"><div><h2>Focus for today</h2><div class="sub">Your progress doesn't need to be perfect. Keep it sustainable.</div></div><button class="btn" onclick="switchTab('Goals')">View goals →</button></div></div></div>`}function habitList(compact=false){const a=compact?state.habits.slice(0,5):state.habits;return `<div class="list">${a.length?a.map(h=>`<div class="item ${h.done===date()?'done':''}"><span class="itemname">${escapeHTML(h.name)}</span><span><button class="btn ${h.done===date()?'ghost':''}" onclick="toggleHabit(${h.id})">${h.done===date()?'✓ Done':'Mark done'}</button>${compact?'':` <button class="btn danger" onclick="deleteItem('habits',${h.id})">×</button>`}</span></div>`).join(''):'<div class="empty">Add your first habit!</div>'}</div>`}function habits(){return `<div class="card"><h2>Habit tracker 🌱</h2><div class="sub">Check off habits once per day. Reset happens automatically on a new day.</div><form class="formrow" onsubmit="addHabit(event)"><input class="input" name="name" maxlength="70" placeholder="New habit" required><button class="btn">Add +</button></form>${habitList()}</div>`}function toggleHabit(id){let h=state.habits.find(x=>x.id===id);if(h){h.done=h.done===date()?'':date();log();render()}}function addHabit(e){e.preventDefault();let n=e.target.name.value.trim();if(n){state.habits.push({id:uid(),name:n,done:''});save();render();notice('Habit added!')}}function deleteItem(k,id){state[k]=state[k].filter(x=>x.id!==id);if(k==='habits')log();save();render()}function workouts(){return `<div class="grid"><div class="card wide"><h2>Workout log 🏃</h2><div class="sub">Track activity, not calories or appearance.</div><form onsubmit="addWorkout(event)"><div class="formrow"><input class="input" name="activity" maxlength="80" placeholder="Activity (walk, yoga, football...)" required><input class="input" name="minutes" type="number" min="1" max="600" placeholder="Minutes" required></div><button class="btn">Log activity +</button></form></div><div class="card"><h2>Sessions</h2><div class="metric">${state.workouts.length}</div><div class="hint">All time</div></div><div class="card full"><h2>History</h2>${listRecords('workouts',w=>`${escapeHTML(w.activity)} • ${w.minutes} min • ${w.date}`)}</div></div>`}function addWorkout(e){e.preventDefault();const f=e.target;state.workouts.unshift({id:uid(),activity:f.activity.value.trim(),minutes:+f.minutes.value,date:date()});save();render();notice('Workout saved!')}function sleep(){return `<div class="grid"><div class="card wide"><h2>Sleep journal 🌙</h2><div class="sub">Record how long you slept and how rested you feel.</div><form onsubmit="addSleep(event)"><div class="formrow"><input class="input" name="hours" type="number" min="0.5" max="24" step="0.5" placeholder="Hours slept" required><select class="input" name="quality"><option>Great</option><option>Okay</option><option>Tired</option></select></div><button class="btn">Save sleep +</button></form></div><div class="card"><h2>Average sleep</h2><div class="metric">${avgSleep()} h</div><div class="hint">Last 7 entries</div></div><div class="card full"><h2>Sleep history</h2>${listRecords('sleep',x=>`${x.hours} hours • ${escapeHTML(x.quality)} • ${x.date}`)}</div></div>`}function addSleep(e){e.preventDefault();state.sleep.unshift({id:uid(),hours:+e.target.hours.value,quality:e.target.quality.value,date:date()});save();render();notice('Sleep recorded!')}function goals(){return `<div class="card"><h2>Goals 🎯</h2><div class="sub">Set meaningful goals and celebrate milestones.</div><form class="formrow" onsubmit="addGoal(event)"><input class="input" name="name" maxlength="100" placeholder="Something you want to achieve" required><button class="btn">Add +</button></form><div class="list">${state.goals.length?state.goals.map(g=>`<div class="item ${g.done?'done':''}"><span class="itemname">${escapeHTML(g.name)}</span><span><button class="btn ${g.done?'ghost':''}" onclick="toggleGoal(${g.id})">${g.done?'✓ Achieved':'Complete'}</button> <button class="btn danger" onclick="deleteItem('goals',${g.id})">×</button></span></div>`).join(''):'<div class="empty">Your first goal starts here.</div>'}</div></div>`}function addGoal(e){e.preventDefault();state.goals.unshift({id:uid(),name:e.target.name.value.trim(),done:false});save();render()}function toggleGoal(id){let g=state.goals.find(x=>x.id===id);if(g){g.done=!g.done;save();render();if(g.done)notice('Goal achieved! ✨')}}function analytics(){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));return d.toLocaleDateString('en-CA')});const max=Math.max(1,...days.map(d=>state.activity[d]||0));return `<div class="grid"><div class="card wide"><h2>Last 7 days 📊</h2><div class="sub">Habits completed per day</div><div class="bars">${days.map(d=>`<div class="barwrap"><div class="bar"><i style="height:${(state.activity[d]||0)/max*100}%"></i></div>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})}</div>`).join('')}</div></div><div class="card"><h2>Overview</h2><div class="sub">Goals completed</div><div class="metric">${state.goals.filter(x=>x.done).length}</div><div class="sub">Total workouts</div><div class="metric">${state.workouts.length}</div></div><div class="card full"><h2>Progress philosophy</h2><div class="sub">This is a journal, not a competition. Rest days are progress too.</div></div></div>`}function listRecords(k,fmt){return `<div class="list">${state[k].length?state[k].slice(0,30).map(x=>`<div class="item"><span>${fmt(x)}</span><button class="btn danger" onclick="deleteItem('${k}',${x.id})">×</button></div>`).join(''):'<div class="empty">Nothing logged yet.</div>'}</div>`}function coach(){return `<div class="card"><h2>LifeOS Coach 🤖 <span class="tag">Free offline assistant</span></h2><p class="sub">Ask about your habits, sleep, goals or workouts. This is a built-in rule-based coach, not a connected AI model.</p><div class="chat" id="chat">${state.chat.length?state.chat.map(m=>`<div class="bubble ${m.role}">${escapeHTML(m.text)}</div>`).join(''):'<div class="bubble bot">Hey! I can help you review your progress, plan a routine, or brainstorm small next steps. What’s on your mind?</div>'}</div><form class="formrow" onsubmit="sendChat(event)"><input class="input" name="message" maxlength="500" placeholder="Ask me something..." required><button class="btn">Send ↗</button></form><div class="formrow" style="flex-wrap:wrap"><button class="btn ghost" onclick="quick('How am I doing?')">My progress</button><button class="btn ghost" onclick="quick('Help me plan my day')">Plan my day</button><button class="btn ghost" onclick="quick('Sleep tips')">Sleep tips</button></div></div>`}function answer(t){let s=t.toLowerCase();if(/sleep|tired|bed/.test(s))return `You've logged ${state.sleep.length} sleep entries, with a recent average of ${avgSleep()} hours. A consistent bedtime, a calm wind-down routine, and less bright light before bed may help. If sleep trouble persists, tell a trusted adult or clinician.`;if(/progress|doing|stats|habit/.test(s))return `Today you've completed ${completed()} of ${state.habits.length} habits. You've also logged ${state.workouts.length} workouts and completed ${state.goals.filter(g=>g.done).length} goals overall. You're building a record of your effort, one day at a time.`;if(/plan|routine|day/.test(s))return 'Try a simple plan: choose one important task, take regular breaks, make time for movement you enjoy, and leave room for rest. Which task matters most today?';if(/workout|exercise|fitness/.test(s))return 'Pick movement you enjoy and keep it comfortable. You can log walks, sports, stretching, or other activities in Workouts. Rest matters too!';if(/goal|motivat/.test(s))return 'Choose one tiny action you can take toward a goal today. You can add that goal in the Goals tab and mark it complete when you reach it.';return 'I can help with sleep, habits, workouts, daily planning, and goal-setting. Try asking “How am I doing?” or “Help me plan my day.” For open-ended AI conversations, a separate model connection would be needed.'}function quick(s){state.chat.push({role:'user',text:s},{role:'bot',text:answer(s)});save();render();$('#chat').scrollTop=$('#chat').scrollHeight}function sendChat(e){e.preventDefault();const s=e.target.message.value.trim();if(s)quick(s)}function settings(){return `<div class="card"><h2>Settings ⚙️</h2><form onsubmit="setName(event)"><label class="sub">Display name</label><div class="formrow"><input class="input" name="name" maxlength="35" value="${escapeHTML(state.name)}" placeholder="Your name"><button class="btn">Save</button></div></form><h2 style="margin-top:25px">Your data</h2><p class="sub">Stored locally in this browser. Export a backup before clearing browser storage or switching devices.</p><div class="formrow" style="flex-wrap:wrap"><button class="btn" onclick="exportData()">Export backup ↓</button><label class="btn ghost" style="cursor:pointer">Import backup <input type="file" accept="application/json" onchange="importData(event)" hidden></label><button class="btn danger" onclick="resetData()">Reset all data</button></div></div>`}function setName(e){e.preventDefault();state.name=e.target.name.value.trim();save();render();notice('Saved!')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='lifeos-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){try{const v=JSON.parse(await e.target.files[0].text());if(!v||!Array.isArray(v.habits)||!Array.isArray(v.goals)||!Array.isArray(v.sleep)||!Array.isArray(v.workouts)||!Array.isArray(v.chat))throw Error('Invalid backup');state={...structuredClone(defaults),...v};save();render();notice('Backup imported')}catch{notice('Could not import that backup')}}function resetData(){if(confirm('Delete all LifeOS data from this browser?')){state=structuredClone(defaults);save();render();notice('Data cleared')}}log();render();
</script></body></html>
